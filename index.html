<head>

<style>
:root{color-scheme:dark;--bg:#020617;--fg:#f8fafc;--muted:#64748b;--orange:#f97316;--cyan:#38bdf8;--line:#1e293b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid var(--cyan);outline-offset:5px}#world{position:absolute;inset:0}#world canvas{width:100%;height:100%;display:block}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(2,6,23,.1),transparent 25%,transparent 70%,rgba(2,6,23,.5))}.hud{position:absolute;z-index:3;inset:0;pointer-events:none;padding:28px 36px;display:flex;flex-direction:column;justify-content:space-between}.top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-weight:900;letter-spacing:-1.5px;font-size:27px;white-space:nowrap}.brand b{color:var(--orange)}.brand small{display:block;font-size:10px;letter-spacing:2.6px;color:var(--muted);margin-top:5px;font-weight:400}.progress{width:clamp(120px,25vw,340px)}.progress-info{display:flex;justify-content:space-between;gap:12px;font-family:monospace;font-size:12px;letter-spacing:1px;margin-bottom:9px;color:var(--muted)}.track{height:4px;background:#1e293b;border-radius:2px;overflow:hidden}.fill{height:100%;width:0;background:var(--orange);transition:width .1s}.tools{display:flex;gap:8px;pointer-events:auto}.icon-btn{background:#0f172ae8;border:1px solid #334155;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}.icon-btn:hover{background:#1e293b}.icon-btn svg{width:18px;height:18px}.stat-label{font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:6px}.shield{display:flex;gap:8px;align-items:center}.shield .tire{width:26px;height:26px;color:var(--cyan);transition:color .2s, opacity .2s;filter:drop-shadow(0 0 6px rgba(56,189,248,.6))}.shield .tire.lost{color:#334155;opacity:.35;filter:none}.hp-text{font:bold 22px monospace;color:var(--cyan);margin-right:4px;text-shadow:0 0 10px rgba(56,189,248,.5)}.metric{font:24px monospace}.metric em{font-size:16px;font-style:normal;color:#facc15}.bottom .right{text-align:right}.controls{pointer-events:auto;display:flex;gap:10px;align-items:center}.control{width:52px;height:44px;background:#0f172abb;border:1px solid #334155;border-radius:7px;font-size:21px}.control:hover,.control:active{background:#1e293b}.control-help{font-size:11px;color:var(--muted);letter-spacing:1px;margin:0 8px}.layer{position:absolute;z-index:2;inset:0;display:flex;align-items:center;padding:112px 7vw 120px;background:linear-gradient(90deg,rgba(2,6,23,.95),rgba(2,6,23,.8) 38%,rgba(2,6,23,.1) 80%)}.layer.hidden{display:none}.panel{max-width:560px}.eyebrow{display:flex;align-items:center;gap:10px;font:11px monospace;letter-spacing:2px;color:var(--cyan);margin-bottom:22px}.eyebrow::before{content:'';height:6px;width:6px;background:var(--cyan);border-radius:50%}h1{font-size:clamp(44px,6.3vw,86px);font-weight:800;line-height:.97;letter-spacing:-.055em;margin:0 0 23px}h1 span{color:var(--orange)}.description{font-size:16px;line-height:1.65;color:#94a3b8;max-width:340px;margin:0 0 28px}.primary{height:54px;min-width:214px;display:inline-flex;align-items:center;justify-content:space-between;gap:30px;padding:0 24px;border:0;border-radius:4px;background:var(--orange);color:#0f172a;font-size:14px;font-weight:700}.primary:hover{background:#fb923c}.primary .arrow{font-size:23px;font-weight:400}.secondary{display:none;margin-left:10px;height:54px;padding:0 18px;border:1px solid var(--line);border-radius:4px;background:#0f172a;font-size:14px}.tip{margin-top:20px;font-size:12px;color:var(--muted);line-height:1.7}.tip kbd{font:11px monospace;padding:3px 5px;border:1px solid #334155;border-radius:3px;color:var(--fg)}.record{font:11px monospace;letter-spacing:1px;color:var(--muted);margin-top:30px;padding-top:18px;border-top:1px solid #1e293b;max-width:340px}.record strong{color:var(--fg);font-weight:400}#toast{position:absolute;z-index:5;left:50%;top:105px;transform:translateX(-50%);font:13px monospace;color:var(--orange);background:#0f172ae8;border:1px solid #334155;padding:12px 18px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap}#toast.show{opacity:1}#flash{position:absolute;z-index:4;inset:0;background:rgba(239,68,68,.25);pointer-events:none;opacity:0}#engine{position:absolute;z-index:3;bottom:100px;right:36px;color:#64748b;font:10px monospace;letter-spacing:1px;pointer-events:none}#result{display:none;margin:0 0 22px;gap:32px}#result strong{font:28px monospace;display:block;margin-top:6px}#result span{font-size:10px;letter-spacing:1.5px;color:var(--muted)}
</style>

<div id="world"></div><div class="shade"></div>
<div class="hud"><header class="top"><div class="brand">ION<span style="font-weight:400">/</span>RUN<b>·</b><small>PORSCHE 911 GT3 RS</small></div><div class="progress"><div class="progress-info"><span id="distance">0000 М</span><span id="speedVal">86 КМ/Ч</span></div><div class="track"><div class="fill" id="progress"></div></div></div><div class="tools"><button class="icon-btn" id="sound" aria-label="Звук"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="soundPath" d="m16 9 6 6m0-6-6 6"/></svg></button><button class="icon-btn" id="pause" aria-label="Пауза"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button></div></header><footer class="bottom"><div><div class="stat-label">ЖИЗНИ (ШИНЫ)</div><div class="shield" id="shield"><span class="hp-text" id="hpText">3/3</span><svg class="tire" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zm0-13a5 5 0 1 0 5 5 5 5 0 0 0-5-5zm0 8a3 3 0 1 1 3-3 3 3 0 0 1-3 3z"/></svg><svg class="tire" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zm0-13a5 5 0 1 0 5 5 5 5 0 0 0-5-5zm0 8a3 3 0 1 1 3-3 3 3 0 0 1-3 3z"/></svg><svg class="tire" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zm0-13a5 5 0 1 0 5 5 5 5 0 0 0-5-5zm0 8a3 3 0 1 1 3-3 3 3 0 0 1-3 3z"/></svg></div></div><div class="controls"><button class="control" id="left">←</button><span class="control-help">A / D · ← / →</span><button class="control" id="right">→</button></div><div class="right"><div class="stat-label">МОНЕТЫ</div><div class="metric"><em>🪙</em> <span id="coins">00</span></div></div></footer></div>
<div id="engine">ЗАГРУЗКА 3D...</div><div id="flash"></div><div id="toast"></div>
<section class="layer" id="overlay"><div class="panel"><div class="eyebrow" id="eyebrow">GT3 RS INFINITE MODE</div><h1 id="title">БЕСКОНЕЧНЫЙ<br><span>ТРЕК.</span></h1><p class="description" id="description">Ночной заезд за рулём Porsche GT3 RS.<br>Уклоняйся от препятствий, собирай монеты и ключи ремонта.</p><div id="result"><div><span>ОЧКИ</span><strong id="score">0</strong></div><div><span>МОНЕТЫ</span><strong id="endCoins">0</strong></div></div><button class="primary" id="start"><span id="startLabel">НАЧАТЬ ЗАЕЗД</span><span class="arrow">↗</span></button><button class="secondary" id="restart">Заново</button><div class="tip"><kbd>→</kbd> <kbd>←</kbd> — руль · <kbd>Пробел</kbd> — пауза</div><div class="record">ЛИЧНЫЙ РЕКОРД &nbsp; <strong id="best">0000</strong></div></div></section>

<script>
'use strict';
const $=id=>document.getElementById(id);
let state='menu', lane=1, shipX=0, meters=0, coins=0, health=3, speed=24, elapsed=0, invincible=0, spawnTimer=.7, objects=[], best=0, soundOn=false, audio=null, sceneryTime=0, last=performance.now(), toastTime=0;
try{best=Number(localStorage.getItem('ion-run-best-v4'))||0}catch(e){} $('best').textContent=String(best).padStart(4,'0');
let renderer3D=null;
const W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);

function notify(text){$('toast').textContent=text;$('toast').classList.add('show');toastTime=1.7}
function refresh(){ 
  $('distance').textContent=String(Math.floor(meters)).padStart(4,'0')+' М';
  $('speedVal').textContent=Math.floor(speed*3.6)+' КМ/Ч';
  $('progress').style.width=Math.min(100,((speed-24)/50)*100)+'%';
  $('coins').textContent=String(coins).padStart(2,'0');
  $('hpText').textContent=health+'/3';
  $('shield').querySelectorAll('.tire').forEach((e,i)=>e.classList.toggle('lost',i>=health));
}
function clearObjects(){objects.forEach(o=>{if(renderer3D)renderer3D.remove(o)});objects=[]}
function addObject(type,l,z){const o={type,x:(l-1)*3.6,z,mesh:null};objects.push(o);if(renderer3D)renderer3D.add(o)}

function spawn(){
  const safe=Math.floor(Math.random()*3), danger=[0,1,2].filter(l=>l!==safe);
  addObject(Math.random()>.5?'sand':'brick', danger[0], -135);
  if(Math.random()>.35) addObject(Math.random()>.5?'sand':'brick', danger[1], -135);
  addObject(Math.random()<0.08?'key':'coin', safe, -135);
}
function start(){toastTime=0;$('toast').classList.remove('show');clearObjects();lane=1;shipX=0;meters=0;coins=0;health=3;elapsed=0;speed=24;invincible=0;spawnTimer=.2;state='playing';$('overlay').classList.add('hidden');document.body.classList.add('running');$('flash').style.opacity=0;refresh();last=performance.now()}
function move(dir){if(state!=='playing')return;lane=Math.max(0,Math.min(2,lane+dir))}
function finish(){state='lost';document.body.classList.remove('running');const score=Math.floor(meters)+coins*100;if(score>best){best=score;try{localStorage.setItem('ion-run-best-v4',best)}catch(e){}}$('best').textContent=String(best).padStart(4,'0');$('eyebrow').textContent='ЗАЕЗД ОКОНЧЕН';$('title').innerHTML='ФИНИШ<br><span>РЕЗУЛЬТАТ.</span>';$('description').textContent=`Пройдено ${Math.floor(meters)} метров!`;$('score').textContent=score;$('endCoins').textContent=coins;$('result').style.display='flex';$('startLabel').textContent='ГНАТЬ СНОВА';$('restart').style.display='none';$('overlay').classList.remove('hidden');$('start').focus({preventScroll:true})}
function pause(){if(state==='playing'){state='paused';$('eyebrow').textContent='ПАУЗА';$('title').innerHTML='МОМЕНТ<br><span>ТИШИНЫ.</span>';$('description').textContent='Отдохни и продолжай.';$('result').style.display='none';$('startLabel').textContent='ПРОДОЛЖИТЬ';$('restart').style.display='inline-block';$('overlay').classList.remove('hidden');$('start').focus({preventScroll:true})}else if(state==='paused'){state='playing';$('overlay').classList.add('hidden');last=performance.now()}}

$('start').onclick=()=>state==='paused'?pause():start();$('restart').onclick=start;$('pause').onclick=pause;
$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','KeyA','KeyD'].includes(e.code)){if(e.repeat)return;if(e.code==='ArrowLeft'||e.code==='KeyA')move(-1);if(e.code==='ArrowRight'||e.code==='KeyD')move(1);if(e.code==='Space')pause()}});

function step(dt){
  elapsed+=dt; speed=24+Math.sqrt(meters)*1.25; meters+=speed*dt; invincible=Math.max(0,invincible-dt);
  shipX+=((lane-1)*3.6-shipX)*(1-Math.exp(-16*dt));
  spawnTimer-=dt; if(spawnTimer<=0){spawn();spawnTimer=Math.max(0.38,30/speed)}

  for(let i=objects.length-1;i>=0;i--){
    const o=objects[i]; o.z+=speed*dt;
    const isHazard=o.type==='sand'||o.type==='brick';
    const hit=Math.abs(o.x-shipX)<(isHazard?1.55:.85)&&Math.abs(o.z-4)<1.2;
    let remove=o.z>22;
    if(hit&&o.mesh){
      if(o.type==='coin'){coins++; remove=true;}
      else if(o.type==='key'){health=Math.min(3,health+1); notify('🔧 РЕМОНТ ШИНЫ ('+health+'/3)'); remove=true; refresh();}
      else if(invincible<=0){
        health--; invincible=1.45; $('flash').style.opacity=1; setTimeout(()=>$('flash').style.opacity=0,140);
        notify(health>0?'ПРОБИТИЕ! ОСТАЛОСЬ '+health+'/3':'АВАРИЯ'); remove=true;
        if(health<=0){refresh();finish();return}
      }
    }
    if(remove){if(renderer3D)renderer3D.remove(o); objects.splice(i,1)}
  }
  refresh();
}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.04,Math.max(0,(now-last)/1000));last=now;if(state==='playing')step(dt);if(renderer3D)renderer3D.draw(sceneryTime+=dt,dt);}
requestAnimationFrame(frame);

window.addEventListener('load',()=>{
  setTimeout(()=>{if(window.THREE){initThree();$('engine').textContent='3D НОЧНОЙ РЕЖИМ'}},200);
});

function initThree(){if(!window.THREE||renderer3D)return;try{
  const T=window.THREE, scene=new T.Scene();
  scene.background=new T.Color('#030712');
  scene.fog=new T.FogExp2('#030712',.012);

  const camera=new T.PerspectiveCamera(58,W/H,.1,300);
  camera.position.set(0,4.8,14); camera.lookAt(0,1,-28);
  const renderer=new T.WebGLRenderer({antialias:true,alpha:false});
  renderer.setPixelRatio(dpr); renderer.setSize(W,H);
  
  // Максимально яркое освещение, чтобы всё было отлично видно на любом мониторе
  scene.add(new T.AmbientLight(0xffffff, 2.5));
  const dirLight=new T.DirectionalLight(0xffffff, 3.0);
  dirLight.position.set(10,40,-20); scene.add(dirLight);

  const mat=(color,emissive=0,intensity=0,roughness=.3,metalness=.4)=>new T.MeshStandardMaterial({color,emissive,emissiveIntensity:intensity,roughness,metalness});
  const boxGeo=new T.BoxGeometry(1,1,1);
  function box(w,h,d,m,x,y,z,parent=scene){const o=new T.Mesh(boxGeo,m);o.scale.set(w,h,d);o.position.set(x,y,z);parent.add(o);return o}

  box(11, 0.4, 300, mat(0x1e293b,0,0,0.8,0.2), 0, -0.2, -100);
  box(20, 0.38, 300, mat(0x334155,0,0,0.9), -15.5, -0.21, -100);
  box(20, 0.38, 300, mat(0x334155,0,0,0.9), 15.5, -0.21, -100);

  const curbLeft=new T.Group(), curbRight=new T.Group(); scene.add(curbLeft); scene.add(curbRight);
  for(let i=0; i<60; i++){
    const m=(i%2===0)?mat(0xef4444):mat(0xf8fafc);
    box(0.35,0.2,4,m,-5.6,0.1,-i*4,curbLeft); box(0.35,0.2,4,m,5.6,0.1,-i*4,curbRight);
  }

  const car=new T.Group(); scene.add(car);
  const carBody=mat(0xf8fafc,0,0,0.15,0.7), carbon=mat(0x0f172a,0,0,0.8,0.3), glass=mat(0x0f172a,0x38bdf8,0.5,0.1,0.9);
  box(1.78,0.08,3.55,carbon,0,0.12,0,car);
  box(1.36,0.42,1.35,carBody,0,0.55,-0.05,car);
  box(1.26,0.36,0.95,glass,0,0.58,-0.1,car);
  box(1.72,0.36,1.25,carBody,0,0.32,0.95,car);
  box(0.32,0.18,0.1,mat(0xffffff,0xffffff,4.0),-0.54,0.36,-1.6,car);
  box(0.32,0.18,0.1,mat(0xffffff,0xffffff,4.0),0.54,0.36,-1.6,car);

  const wheels=[];
  [-0.88,0.88].forEach(x=>[-0.98,0.98].forEach(z=>{
    const w=box(0.26,0.58,0.58,carbon,x,0.29,z,car); wheels.push(w);
  }));

  const coinMat=mat(0xfacc15,0xca8a04,0.8,0.1,0.9), keyMat=mat(0x38bdf8,0x0284c7,1.2,0.1,0.8);
  const sMat=mat(0xd97706,0,0,0.9), bMat=mat(0xb91c1c,0,0,0.7);

  renderer3D={
    add(o){
      if(o.type==='coin'){ o.mesh=new T.Mesh(new T.CylinderGeometry(0.38,0.38,0.08,16),coinMat); o.mesh.rotation.x=Math.PI/2; o.mesh.position.y=0.38; }
      else if(o.type==='key'){ o.mesh=new T.Mesh(new T.BoxGeometry(0.3,0.3,0.3),keyMat); o.mesh.position.y=0.4; }
      else if(o.type==='sand'){ o.mesh=new T.Mesh(new T.ConeGeometry(1.3,0.9,8),sMat); o.mesh.position.y=0.45; }
      else if(o.type==='brick'){ o.mesh=new T.Mesh(new T.BoxGeometry(1.4,0.7,0.8),bMat); o.mesh.position.y=0.35; }
      o.mesh.position.x=o.x; o.mesh.position.z=o.z; scene.add(o.mesh);
    },
    remove(o){if(o.mesh){scene.remove(o.mesh); o.mesh=null}},
    draw(t,dt){
      curbLeft.position.z=(meters*0.8)%8; curbRight.position.z=(meters*0.8)%8;
      const steer=(shipX-(lane-1)*3.6);
      car.position.set(shipX,0,4);
      car.rotation.y=Math.max(-.22,Math.min(.22,steer*0.12));
      wheels.forEach(w=>w.rotation.x+=dt*(speed*0.8));
      car.visible=invincible<=0||Math.floor(t*12)%2===0;

      objects.forEach(o=>{
        if(o.mesh){
          o.mesh.position.z=o.z;
          if(o.type==='coin'||o.type==='key') o.mesh.rotation.y=t*3;
        }
      });
      camera.position.x+=(shipX*0.13-camera.position.x)*0.1;
      renderer.render(scene,camera);
    }
  };
  $('world').replaceChildren(renderer.domElement);
}catch(e){console.error(e)}}
</script>
</body>
</html>
